apiVersion: apps/v1
kind: Deployment
metadata:
  name: fg-marketmaker
  labels:
    app: fg-marketmaker
spec:
  replicas: ${REPLICA_APP}
  selector:
    matchLabels:
      app: fg-marketmaker
  template:
    metadata:
      labels:
        app: fg-marketmaker
    spec:
      nodeSelector:
        alibabacloud.com/nodepool-id: ${NODEGROUP_APP}
      containers:
      - name: fg-marketmaker
        image: ${ECR_APP}:${IMAGE_TAG}
        ports:
        - containerPort: 9994
        envFrom:
        - configMapRef:
            name: fg-marketmaker-config
        - secretRef:
            name: fg-marketmaker-secrets
        resources:
          requests:
            cpu: "${REQUEST_CPU_APP}"
            memory: "${REQUEST_MEMORY_APP}"
          limits:
            cpu: "${LIMIT_CPU_APP}"
            memory: "${LIMIT_MEMORY_APP}"
      imagePullSecrets:
      - name: acr-secret
